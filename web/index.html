<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>의료급여 지원업무 조회</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#16304b;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14365b;color:white;padding:38px max(24px,calc((100vw - 1200px)/2))}h1{margin:5px 0;font-size:clamp(25px,4vw,38px)}header p{color:#cbdff1}main{max-width:1200px;margin:30px auto;padding:0 20px}.panel,.card{background:white;border:1px solid #dce6ef;border-radius:16px;box-shadow:0 4px 14px #1736500b}.panel{padding:24px;margin-bottom:20px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #aebfcf;border-radius:9px;font:inherit}fieldset{margin:0;border:1px solid #dce6ef;border-radius:10px;min-width:0}legend{font-weight:700}fieldset label{font-weight:400;display:flex;gap:7px;align-items:center;padding:3px 0}input[type=checkbox]{width:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.card{padding:20px}.card h3{margin:0 0 10px;font-size:17px}.meta{display:flex;justify-content:space-between;color:#536b80;font-size:14px}.tag{display:inline-block;background:#e6f3fd;color:#135181;padding:5px 9px;border-radius:7px;font-size:13px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;font-size:14px}.details span{color:#62798c}.ranking{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.rank{background:#f2f7fc;padding:14px;border-radius:9px}.rank strong{display:block;margin:7px 0}.empty{padding:35px;text-align:center;background:white;border-radius:12px}@media(max-width:740px){.controls{grid-template-columns:1fr}header{padding:32px 20px}}
</style></head><body><header><small>보건복지부 · 업무 현황</small><h1>의료급여 대상자 지원업무</h1><p>업무 기록을 검색하고 기관별 현황을 확인하세요.</p></header><main><section class="panel"><p>CSV 파일은 브라우저에서만 읽으며 서버로 전송되지 않습니다.</p><div class="controls"><div><label for="workfile">업무데이터 CSV</label><input id="workfile" type="file" accept=".csv,text/csv"></div><div><label for="orgfile">기관현황 CSV</label><input id="orgfile" type="file" accept=".csv,text/csv"></div></div><p id="message" role="status"></p></section><section class="panel"><div class="controls"><div><label for="search">업무ID · 담당부서 검색</label><input id="search" type="search" placeholder="업무ID 또는 담당부서 입력"></div><fieldset id="types"><legend>업무유형 (복수 선택)</legend></fieldset><fieldset id="statuses"><legend>처리상태 (복수 선택)</legend></fieldset></div></section><section class="panel"><h2>우수기관 만족도 상위 5개</h2><div id="ranking" class="ranking"></div></section><div class="toolbar"><h2 id="count" aria-live="polite">결과 0건</h2><span>기준일자 최신순</span></div><div id="cards" class="grid"></div></main><script>
let WORK=[],ORGS=[];
function parseCSV(text){const rows=[],row=[];let cell="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=""}else if(c==='\n'){row.push(cell.replace(/\r$/, ""));rows.push([...row]);row.length=0;cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const headers=(rows.shift()||[]).map((x,i)=>i===0?x.replace(/^\uFEFF/,""):x);return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??""])))}

const $=id=>document.getElementById(id);const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function options(id,key){[...new Set(WORK.map(r=>r[key]))].sort((a,b)=>a.localeCompare(b,'ko')).forEach(value=>{const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.value=value;check.addEventListener('change',render);label.append(check,document.createTextNode(value));$(id).append(label)})}
$('search').addEventListener('input',render);
function ranking(){const top=ORGS.filter(o=>o['우수기관여부']?.trim().toUpperCase()==='Y').sort((a,b)=>Number(b['만족도'])-Number(a['만족도'])||a['기관명'].localeCompare(b['기관명'],'ko')).slice(0,5);$('ranking').innerHTML=top.map((o,i)=>`<div class="rank"><span>${i+1}위 · ${escapeHTML(o['기관유형'])}</span><strong>${escapeHTML(o['기관명'])}</strong>만족도 ${escapeHTML(o['만족도'])}</div>`).join('')||'기관현황 CSV를 선택해 주세요.'}
async function load(id,required,target){const f=$(id).files[0];if(!f)return;try{const data=parseCSV(await f.text());if(data.length&&!required.every(k=>Object.hasOwn(data[0],k)))throw Error('필수 열이 없습니다: '+required.join(', '));if(target==='work'){WORK=data;$('types').replaceChildren();$('statuses').replaceChildren();options('types','업무유형');options('statuses','처리상태');render()}else{ORGS=data;ranking()}$('message').textContent=`${f.name}: ${data.length}건 불러옴`}catch(e){$('message').textContent='파일 오류: '+e.message}}
$('workfile').addEventListener('change',()=>load('workfile',['업무ID','기준일자','업무유형','처리상태','담당부서'],'work'));
$('orgfile').addEventListener('change',()=>load('orgfile',['기관명','기관유형','우수기관여부','만족도'],'org'));ranking();
function render(){const q=$('search').value.trim().toLocaleLowerCase(),types=new Set([...$('types').querySelectorAll(':checked')].map(e=>e.value)),statuses=new Set([...$('statuses').querySelectorAll(':checked')].map(e=>e.value));const matched=WORK.filter(r=>(!q||r['업무ID'].toLocaleLowerCase().includes(q)||r['담당부서'].toLocaleLowerCase().includes(q))&&(!types.size||types.has(r['업무유형']))&&(!statuses.size||statuses.has(r['처리상태']))).sort((a,b)=>b['기준일자'].localeCompare(a['기준일자'])||b['업무ID'].localeCompare(a['업무ID']));$('count').textContent=`결과 ${matched.length.toLocaleString('ko-KR')}건`;$('cards').innerHTML=matched.length?matched.map(r=>`<article class="card"><div class="meta"><span>${escapeHTML(r['기준일자'])}</span><span class="tag">${escapeHTML(r['처리상태'])}</span></div><h3>${escapeHTML(r['업무ID'])}</h3><div class="details"><div><span>업무유형</span><br>${escapeHTML(r['업무유형'])}</div><div><span>담당부서</span><br>${escapeHTML(r['담당부서'])}</div><div><span>지역 / 기관유형</span><br>${escapeHTML(r['지역'])} / ${escapeHTML(r['기관유형'])}</div><div><span>처리기간</span><br>${escapeHTML(r['처리기간_일'])}일</div></div></article>`).join(''):'<div class="empty">검색 조건에 맞는 업무가 없습니다.</div>'}render();
</script></body></html>
